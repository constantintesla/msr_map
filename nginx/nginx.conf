events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream backend {
        server backend:8000;
    }

    # HTTP → HTTPS redirect + ACME challenge
    server {
        listen 80;
        server_name preshevkadastr.ru www.preshevkadastr.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name preshevkadastr.ru www.preshevkadastr.ru;

        ssl_certificate     /etc/letsencrypt/live/preshevkadastr.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/preshevkadastr.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # Статика фронтенда (SPA hash routing)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # REST API → backend (фото до 12 МБ, видео до 80 МБ)
        location /api/ {
            client_max_body_size 100m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket → backend
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://backend/health;
        }
    }
}
